<form id="feedbackForm"
      action="https://formsubmit.co/2580d00419e1f2e0c7c49ec9d884f12c"
      method="POST">

  <!-- Hidden Settings for FormSubmit -->
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_template" value="box">
  <input type="hidden" name="_subject" value="New Chore Manager Feedback">

  <!-- ⭐ Redirect if the user opens the FormSubmit link manually -->
  <input type="hidden" name="_next" value="https://thesavior1214.github.io/">

  <div class="form-group">
    <label for="userName">Your Name:</label>
    <input type="text" id="userName" name="userName" required />
  </div>

  <div class="form-group">
    <label for="userEmail">Your Email:</label>
    <input type="email" id="userEmail" name="userEmail" required />
  </div>

  <div class="rating-section">
    <p>How would you rate your experience?</p>
    <div class="stars" data-rating="0">
      <span class="star" data-value="1">&#9733;</span>
      <span class="star" data-value="2">&#9733;</span>
      <span class="star" data-value="3">&#9733;</span>
      <span class="star" data-value="4">&#9733;</span>
      <span class="star" data-value="5">&#9733;</span>
    </div>
    <input type="hidden" name="rating" id="ratingInput" value="0" />
  </div>

  <div class="form-group">
    <label for="feedbackText">Additional Comments or Suggestions:</label>
    <textarea id="feedbackText" name="feedback" placeholder="Your feedback helps us improve..."></textarea>
  </div>

  <button type="submit">Submit Feedback</button>
  <div id="thankYouMessage" class="message" style="display:none;">
    Thanks for the feedback!
  </div>

</form>

<script>
  const stars = document.querySelector('.stars');
  const ratingInput = document.getElementById('ratingInput');
  const thankYouMessage = document.getElementById('thankYouMessage');
  const feedbackForm = document.getElementById('feedbackForm');

  // ⭐ STAR RATING LOGIC
  stars.addEventListener('click', (e) => {
    if (e.target.classList.contains('star')) {
      const value = parseInt(e.target.dataset.value);
      ratingInput.value = value;
      updateStars(value);
    }
  });

  stars.addEventListener('mouseover', (e) => {
    if (e.target.classList.contains('star')) {
      const value = parseInt(e.target.dataset.value);
      highlightStars(value);
    }
  });

  stars.addEventListener('mouseout', () => {
    updateStars(parseInt(ratingInput.value));
  });

  function updateStars(rating) {
    stars.querySelectorAll('.star').forEach(star => {
      star.classList.toggle('selected', parseInt(star.dataset.value) <= rating);
    });
  }

  function highlightStars(rating) {
    stars.querySelectorAll('.star').forEach(star => {
      star.style.color = parseInt(star.dataset.value) <= rating ? '#f1c40f' : '#ccc';
    });
  }

  // ⭐ CONFETTI + AJAX SUBMISSION (NO REDIRECT)
  feedbackForm.addEventListener('submit', async (e) => {
    e.preventDefault(); // stop page reload

    launchConfetti();
    thankYouMessage.style.display = 'block';

    const formData = new FormData(feedbackForm);

    // ⭐ Send via AJAX - FormSubmit will NOT redirect and will NOT show the thanks page
    await fetch(feedbackForm.action, {
      method: "POST",
      body: formData
    });

    // Optional: clear the form after submission
    feedbackForm.reset();
    ratingInput.value = 0;
    updateStars(0);
  });

  function launchConfetti() {
    confetti({
      particleCount: 120,
      spread: 80,
      origin: { y: 0.6 },
      scalar: 1.1
    });
  }

  updateStars(0);
</script>
